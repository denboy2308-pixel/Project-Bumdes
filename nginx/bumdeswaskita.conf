# ====================================================================
# Nginx Configuration: BUMDES Waskita Wijaya (bumdeswaskita.desa.id)
# Production-ready reverse proxy with SSL, HTTP/2, Gzip & Rate Limiting
# ====================================================================

# Rate Limiting Zone: Prevent DDoS & brute-force on authentication
limit_req_zone $binary_remote_addr zone=bumdes_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=bumdes_auth:10m rate=5r/s;

# Upstream Node.js Backend Server
upstream bumdes_backend {
    server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# 1. HTTP Server - Auto Redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name bumdeswaskita.desa.id www.bumdeswaskita.desa.id;

    # Let's Encrypt ACME Challenge verification directory
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Redirect all HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Server - Primary Production Endpoint
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bumdeswaskita.desa.id www.bumdeswaskita.desa.id;

    # SSL Certificates (Let's Encrypt / Certbot / ZeroSSL)
    ssl_certificate /etc/letsencrypt/live/bumdeswaskita.desa.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bumdeswaskita.desa.id/privkey.pem;

    # Modern TLS Protocols and Ciphers (Mozilla Modern Configuration)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 1.1.1.1 valid=300s;
    resolver_timeout 5s;

    # Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Upload Limit (e.g. proof of payment or ID scan uploads)
    client_max_body_size 10M;

    # Static Assets Caching (Vite build assets with content hashes)
    location ~* \.(?:css|js|woff2?|eot|ttf|otf|ico|jpg|jpeg|png|webp|svg)$ {
        proxy_pass http://bumdes_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, no-transform, immutable";
    }

    # API Rate Limiting for Auth
    location /api/auth/ {
        limit_req zone=bumdes_auth burst=10 nodelay;
        proxy_pass http://bumdes_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # General API Endpoint
    location /api/ {
        limit_req zone=bumdes_api burst=40 nodelay;
        proxy_pass http://bumdes_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Main Application Proxy (SPA + Server)
    location / {
        proxy_pass http://bumdes_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
